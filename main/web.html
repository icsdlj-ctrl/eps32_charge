<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自动定位天气充电站</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8f2ff;font:15px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 16px}h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0 0 14px}small,.muted{color:#91a7c1}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.panel,.port{background:#112034;border:1px solid #263b54;border-radius:14px;padding:16px;margin-top:15px}.power{font-size:26px;font-weight:700;margin:8px 0;color:#55dbed}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;margin:12px 0 5px}input,select,button{font:inherit;border-radius:8px;min-height:38px}input,select{width:100%;background:#071322;color:inherit;border:1px solid #344b68;padding:7px 10px}input[type=checkbox]{width:auto;min-height:0}button{background:#55dbed;color:#042531;border:0;padding:8px 16px;cursor:pointer;margin-top:12px}button.secondary{background:#2c405a;color:#d9e8fa}.row{display:flex;gap:10px}.row>*{flex:1}.weather{font-size:20px;line-height:1.6}.days{display:flex;gap:8px;margin-top:12px}.day{flex:1;padding:10px;background:#0b1728;border-radius:10px;font-size:13px}.notice{color:#a6b9cf;line-height:1.5}canvas{display:block;width:100%;height:auto;image-rendering:auto;background:#000;border-radius:5px;margin-top:12px}#message{min-height:22px;margin-top:14px;color:#6ce8b6}@media(max-width:620px){.cols{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}</style>
<body><main class=wrap><h1>自动定位天气充电站</h1><div class=muted id=connection>连接中…</div><div class=panel><h2>设备屏幕</h2><select id=page><option value=0>自动轮播</option><option value=1>充电数据</option><option value=2>桌面时钟</option><option value=3>本地天气</option></select><canvas id=screen width=284 height=76></canvas><button onclick="command({setPage:{value:+page.value}})">切换页面</button><button class=secondary onclick="loadScreen()">刷新屏幕</button></div><div class=grid id=ports></div><div class=panel><h2>本地天气</h2><div id=weather class=weather>等待网络和校时</div><div id=days class=days></div><small>天气数据：Open-Meteo.com</small><br><button onclick="command({refreshWeather:true})">更新天气</button></div><div class=cols><section class=panel><h2>联网</h2><p class=notice>设备使用 2.4GHz Wi-Fi。保存后根据公网 IP 自动定位城市并更新天气。VPN 或代理可能影响定位城市。</p><label>Wi-Fi 名称</label><input id=ssid autocomplete=off maxlength=32><label>Wi-Fi 密码</label><input id=password type=password autocomplete=new-password maxlength=63><button onclick="command({setWiFi:{ssid:ssid.value,psw:password.value}}).then(ok=>{if(ok)password.value='';})">保存并连接</button><h2 style="margin-top:24px">背景图片</h2><select id=imageKind><option value=1>时钟背景</option><option value=2>充电背景</option><option value=0>开机背景</option></select><input type=file id=image accept="image/*"><button onclick="uploadImage()">上传背景</button><p class=notice>图片会裁切为 284×76。选择“自定义图片”皮肤后显示。</p></section><section class=panel><h2>显示设置</h2><label>亮度 <span id=brightValue>35</span>%</label><input id=bright type=range min=0 max=100 value=35 oninput="brightValue.textContent=this.value"><label>皮肤</label><select id=skin><option value=0>经典黑</option><option value=1>冰蓝</option><option value=2>暖金</option><option value=3>自定义图片</option></select><label>总功率刻度（W）</label><input id=maxPower type=number min=1 max=1000 value=300><label>低于 0.05A 后清零延时（秒）</label><input id=timeout type=number min=0 max=3600 value=3><label><input id=night type=checkbox> 夜间模式</label><div class=row><div><label>开始</label><input id=start type=time value="22:00"></div><div><label>结束</label><input id=stop type=time value="07:00"></div></div><label>夜间亮度（%）</label><input id=nightBright type=number min=0 max=100 value=8><button onclick="saveDisplay()">保存设置</button></section></div><section class=panel><h2>固件升级</h2><p class=notice>选择本项目的应用固件 holo_weather_station.bin，上传后设备自动重启。</p><input id=firmware type=file accept=".bin"><button onclick="uploadFirmware()">上传固件</button><progress id=otaProgress max=100 value=0 style="width:100%;margin-top:12px"></progress></section><div id=message role=status></div></main>
<script>
let initialized=false;const names=['A1','C1','C2','C3'];const $=id=>document.getElementById(id);for(const name of names){let p=document.createElement('div');p.className='port';p.id='port_'+name;p.innerHTML='<b>'+name+'</b><div class=power>-- W</div><div class=muted>-- V · -- A</div><small>--</small><div class=muted style=margin-top:8px>--mAh · --Wh</div>';$('ports').append(p)}
function say(s){$('message').textContent=s}
async function command(data){try{let r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'设置失败');say('已保存');return true}catch(e){say(e.message);return false}}
const hhmm=v=>+v.replace(':','');function saveDisplay(){return command({setBright:{value:+$('bright').value},setSkinKind:{value:+$('skin').value},setMaxPower:{value:+$('maxPower').value},setTimeOut:{value:+$('timeout').value},setNight:{nightModeIsOn:$('night').checked,nightBright:+$('nightBright').value,startTime:hhmm($('start').value),stopTime:hhmm($('stop').value)}})}
const time=v=>String(Math.floor(v/100)).padStart(2,'0')+':'+String(v%100).padStart(2,'0');
async function poll(){try{let r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error('设备连接中断');let j=await r.json();$('connection').textContent=(j.config.wifiState===2?'Wi-Fi 已连接 · '+j.ip:'等待 Wi-Fi 配网')+' · '+j.config.Ver;for(const name of names){let p=j[name],el=$('port_'+name);el.children[1].textContent=p.valid?p.P.toFixed(1)+' W':'-- W';el.children[2].textContent=p.valid?p.V.toFixed(2)+' V · '+p.I.toFixed(3)+' A':'传感器无数据';el.children[3].textContent=String(Math.floor(p.T/3600)).padStart(2,'0')+':'+String(Math.floor(p.T/60)%60).padStart(2,'0')+':'+String(p.T%60).padStart(2,'0');el.children[4].textContent=p.valid?((p.mAh||0).toFixed(0)+' mAh · '+(p.Wh||0).toFixed(2)+' Wh'):'累计电量 --'}let w=j.weather;$('days').replaceChildren();if(w?.valid){$('weather').textContent=(w.city||'本地')+' · '+w.temperature.toFixed(1)+'℃ · '+w.condition+(w.stale?'（缓存）':'')+' · 湿度 '+(w.humidity<0?'--':w.humidity+'%')+' · 风 '+w.wind.toFixed(0)+' km/h';w.days.forEach((d,i)=>{let el=document.createElement('div');el.className='day';el.textContent=['今天','明天','后天'][i]+' '+d.min.toFixed(0)+'～'+d.max.toFixed(0)+'℃ · 降雨 '+(d.rain<0?'--':d.rain+'%');$('days').append(el)})}else $('weather').textContent=w?.state===6?'正在根据公网 IP 定位':w?.state===2?'等待网络校时':'等待天气数据';if(!initialized){let c=j.config;$('bright').value=c.bright;$('brightValue').textContent=c.bright;$('skin').value=c.imgState;$('maxPower').value=c.maxPower;$('timeout').value=c.timeOut;$('night').checked=c.nightModeIsOn;$('nightBright').value=c.nightBright;$('start').value=time(c.startTime);$('stop').value=time(c.stopTime);$('page').value=c.page;initialized=true}}catch(e){$('connection').textContent=e.message}}
async function loadScreen(){try{let r=await fetch('/api/frame',{cache:'no-store'});if(!r.ok)return;let b=new Uint8Array(await r.arrayBuffer());if(b.length!==284*76*2)return;let ctx=$('screen').getContext('2d'),im=ctx.createImageData(284,76);for(let i=0;i<284*76;i++){let v=(b[i*2]<<8)|b[i*2+1];im.data[i*4]=Math.round(((v>>11)&31)*255/31);im.data[i*4+1]=Math.round(((v>>5)&63)*255/63);im.data[i*4+2]=Math.round((v&31)*255/31);im.data[i*4+3]=255}ctx.putImageData(im,0,0)}catch(e){}}
async function uploadImage(){const f=$('image').files[0];if(!f)return say('请先选择图片');try{const bitmap=await createImageBitmap(f),canvas=document.createElement('canvas');canvas.width=284;canvas.height=76;const ctx=canvas.getContext('2d'),scale=Math.max(284/bitmap.width,76/bitmap.height);ctx.drawImage(bitmap,(284-bitmap.width*scale)/2,(76-bitmap.height*scale)/2,bitmap.width*scale,bitmap.height*scale);bitmap.close();let base64=canvas.toDataURL('image/jpeg',.65).split(',')[1];if(base64.length>16384)throw Error('图片过于复杂，请改用较简单背景');const chunks=Math.ceil(base64.length/256);for(let i=0;i<chunks;i++){let ok=await command({setImage:{type:+$('imageKind').value,totalPackets:chunks,number:i+1,size:base64.length,value:base64.slice(i*256,(i+1)*256)}});if(!ok)return;say('上传图片 '+Math.round((i+1)*100/chunks)+'%')}await command({setSkinKind:{value:3}});say('背景已保存');initialized=false}catch(e){say(e.message)}}
function uploadFirmware(){let f=$('firmware').files[0];if(!f)return say('请先选择应用固件');let x=new XMLHttpRequest();x.open('POST','/api/ota');x.upload.onprogress=e=>{if(e.lengthComputable)$('otaProgress').value=e.loaded*100/e.total};x.onload=()=>say(x.status===200?'升级完成，设备正在重启':'升级失败：请使用本项目应用固件');x.onerror=()=>say('连接中断，请检查设备重启情况');x.send(f);say('正在上传固件…')}
poll();loadScreen();setInterval(poll,2500);setInterval(loadScreen,10000);
</script></body></html>
